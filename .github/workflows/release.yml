name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Official builds bake in the maintainer's OAuth client ids; forks
          # without these secrets still build, but the Google/Microsoft sign-in
          # buttons stay hidden (set the env vars before building to enable them).
          SKIM_GOOGLE_CLIENT_ID: ${{ secrets.SKIM_GOOGLE_CLIENT_ID }}
          SKIM_GOOGLE_CLIENT_SECRET: ${{ secrets.SKIM_GOOGLE_CLIENT_SECRET }}
          SKIM_MICROSOFT_CLIENT_ID: ${{ secrets.SKIM_MICROSOFT_CLIENT_ID }}
          # Updater artifact signing. With createUpdaterArtifacts enabled the
          # build FAILS without these — forks must bring their own keypair or
          # drop the updater config from tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Skim ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # latest.json must point auto-updaters at the NSIS installer; the
          # default here is the MSI, which would silently migrate everyone.
          updaterJsonPreferNsis: true

      # The updater reads signatures from latest.json (embedded there in
      # full); the standalone .sig assets are never fetched — drop them to
      # keep the release page down to setup.exe + msi + latest.json.
      - name: Drop .sig assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} --json assets -q '.assets[].name' |
            Select-String '\.sig$' | ForEach-Object {
              gh release delete-asset ${{ github.ref_name }} $_.Line --yes
            }

  # Both package managers ship the NSIS installer — the same per-user .exe the
  # site links to, and the one the in-app updater knows how to apply. The .msi
  # stays a manual download for managed environments.

  winget:
    needs: build
    # Needs RELEASE_TOKEN and a winget-pkgs fork under the same owner; forks
    # have neither, and a failed job on every tag is just noise.
    if: github.repository == 'nikserg/skim'
    runs-on: ubuntu-latest
    steps:
      # Opens a PR against microsoft/winget-pkgs. The package must already
      # exist there — see packaging/README.md for the one-time bootstrap.
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: nikserg.Skim
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.RELEASE_TOKEN }}

  scoop:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main requires a pull request, and GitHub offers no way to exempt
      # github-actions[bot] on a user-owned repo — so this pushes as the
      # maintainer, who is exempt (branch protection has enforce_admins off).
      # Forks fall back to the stock token and their own unprotected branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Scoop pins an exact URL + hash, so the manifest can only be written
      # once the asset is actually on the release page.
      - name: Point the bucket at the new release
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Skim_${version}_x64-setup.exe"
          curl -fsSL --retry 5 --retry-all-errors -o setup.exe "$url"
          hash="$(sha256sum setup.exe | cut -d ' ' -f 1)"
          rm setup.exe
          # The #/dl.7z fragment is what makes Scoop unpack the NSIS installer
          # with 7-Zip instead of dropping the installer itself into the app dir.
          jq --arg v "$version" --arg u "$url#/dl.7z" --arg h "$hash" \
            '.version = $v
             | .architecture."64bit".url = $u
             | .architecture."64bit".hash = $h' \
            bucket/skim.json > bucket/skim.json.new
          mv bucket/skim.json.new bucket/skim.json

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Manifest already points at ${GITHUB_REF_NAME}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "scoop: skim ${GITHUB_REF_NAME#v}"
          git push
